<nav class="admin-nav" aria-label="Admin">
  <div class="admin-nav-header">
    <div class="admin-nav-brand">
      <img class="admin-nav-logo" src="logo-icon.png" alt="" aria-hidden="true" />
      <span class="admin-nav-brand-name">{{ siteName }}</span>
      <span class="admin-nav-brand-tag">Admin</span>
    </div>
    <div class="admin-nav-bell-wrap" title="Admin Notifications">
      <app-notification-bell align="left"></app-notification-bell>
    </div>
  </div>

  <div class="admin-nav-search-wrap">
    <button type="button" class="admin-nav-search-btn" (click)="openCommandPalette()" title="Quick Jump (Ctrl + K)">
      <svg class="admin-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <span>Search &amp; Jump...</span>
      <kbd>Ctrl K</kbd>
    </button>
  </div>

  <div class="admin-nav-links">
    @for (group of groups; track group.title) {
      <div class="admin-nav-group">
        @if (group.title) {
          <div class="admin-nav-group-title">{{ group.title }}</div>
        }
        @for (link of group.links; track link.path) {
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="link.icon" /></svg>
            <span class="admin-nav-label">{{ link.label }}</span>
            @if (badgeCount(link.badge) > 0) {
              <span class="admin-nav-badge" [attr.aria-label]="badgeCount(link.badge) + ' ' + link.badgeLabel">
                {{ badgeCount(link.badge) > 99 ? '99+' : badgeCount(link.badge) }}
              </span>
            }
          </a>
        }
      </div>
    }
  </div>

  <div class="admin-nav-footer">
    <a routerLink="/" class="admin-nav-back">
      <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.store" /></svg>
      <span class="admin-nav-label">Back to Store</span>
    </a>
    <button type="button" class="admin-nav-logout" (click)="logout()">
      <svg class="admin-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="icons.logout" /></svg>
      <span class="admin-nav-label">Logout</span>
    </button>
  </div>
</nav>

<app-admin-command-palette></app-admin-command-palette>
