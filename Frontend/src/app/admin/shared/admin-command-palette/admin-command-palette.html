@if (isOpen()) {
  <div
    class="palette-backdrop"
    tabindex="-1"
    (click)="$event.target === $event.currentTarget && close()"
    (keydown)="$event.key === 'Escape' && close()"
  >
    <dialog
      open
      class="palette-dialog"
      aria-label="Admin Command Palette"
    >
      <!-- Search Input Header -->
      <div class="palette-input-box">
        <label for="commandPaletteSearch" class="sr-only">Search commands, pages, and orders</label>
        <span class="palette-search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
        </span>
        <input
          #searchInput
          id="commandPaletteSearch"
          type="text"
          class="palette-input"
          placeholder="Type an order #, product, customer, or admin page..."
          aria-label="Search admin commands, pages, and orders"
          [ngModel]="query()"
          (ngModelChange)="onQueryChange($event)"
          (keydown)="onKeydown($event)"
        />
        <button type="button" class="palette-esc-badge" (click)="close()" aria-label="Close command palette">ESC</button>
      </div>

      <!-- Commands & Results List -->
      <div class="palette-list">
        @if (filteredCommands().length === 0) {
          <div class="palette-empty">
            <p>No matching pages, orders, or items found for "{{ query() }}"</p>
          </div>
        } @else {
          @for (item of filteredCommands(); track item.id; let idx = $index) {
            <button
              type="button"
              class="palette-item"
              [class.is-selected]="selectedIndex() === idx"
              (click)="executeCommand(item)"
              (mouseenter)="selectedIndex.set(idx)"
            >
              <svg class="palette-item-icon" viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
              <div class="palette-item-main">
                <div class="palette-item-title">{{ item.title }}</div>
                @if (item.subtitle) {
                  <div class="palette-item-sub">{{ item.subtitle }}</div>
                }
              </div>
              <span class="palette-category-badge">{{ item.category }}</span>
            </button>
          }
        }
      </div>

      <!-- Footer Quick Tips -->
      <footer class="palette-footer">
        <div class="palette-shortcuts">
          <span><kbd>↑</kbd> <kbd>↓</kbd> Navigate</span>
          <span><kbd>↵</kbd> Select</span>
          <span><kbd>ESC</kbd> Close</span>
        </div>
        <div class="palette-hint">Crystal Studio Admin Spotlight</div>
      </footer>
    </dialog>
  </div>
}
