@if (items().length > 0) {
  <aside class="compare-dock" role="region" aria-label="Compare crystals toolbar">
    <div class="compare-dock-inner">
      <div class="compare-dock-header">
        <span class="compare-icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>
          </svg>
        </span>
        <div class="compare-dock-title">
          <strong>Compare Crystals</strong>
          <span class="compare-count-tag">{{ count() }} / {{ max }}</span>
        </div>
      </div>

      <div class="compare-dock-items">
        @for (item of items(); track item.productId) {
          <div class="dock-thumb-wrap" [title]="item.name">
            <img [src]="getImage(item)" [alt]="item.name" class="dock-thumb" imgFallback />
            <button
              type="button"
              class="dock-remove-thumb"
              [attr.aria-label]="'Remove ' + item.name + ' from comparison'"
              (click)="remove(item, $event)"
            >
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        }
      </div>

      <div class="compare-dock-actions">
        <button
          type="button"
          class="btn btn-compare-open"
          (click)="open()"
        >
          Compare Now
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
        <button type="button" class="btn-compare-clear" (click)="clear()">Clear</button>
      </div>
    </div>
  </aside>
}
