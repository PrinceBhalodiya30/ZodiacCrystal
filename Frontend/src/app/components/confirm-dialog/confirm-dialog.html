@if (service.request(); as request) {
  <div class="confirm-overlay" animate.leave="confirm-leaving" (click)="service.respond(false)">
    <div class="confirm-panel" (click)="$event.stopPropagation()">
      <span class="confirm-icon" [class.danger]="request.danger">
        @if (request.danger) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v5"/>
            <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
          </svg>
        }
      </span>
      <p class="confirm-message">{{ request.message }}</p>
      @if (request.reasons) {
        <label class="confirm-reason">
          <span>Reason</span>
          <select [value]="selectedReason()" (change)="selectedReason.set($any($event.target).value)">
            <option value="" disabled>Choose a reason...</option>
            @for (reason of request.reasons; track reason) {
              <option [value]="reason">{{ reason }}</option>
            }
          </select>
        </label>
      }
      <div class="confirm-actions">
        <button type="button" class="btn btn-outline" (click)="service.respond(false)">
          {{ request.cancelLabel }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="request.danger"
          [disabled]="request.reasons && !selectedReason()"
          (click)="service.respond(true, selectedReason() || undefined)"
        >
          {{ request.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
