@if (isOpen) {
  <div class="app-modal-overlay" (click)="onBackdropClick()" role="presentation">
    <div
      #dialogEl
      class="app-modal-dialog"
      [style.max-width]="maxWidth"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title ? undefined : (ariaLabel || 'Dialog window')"
      [attr.aria-labelledby]="title ? 'modal-dialog-title' : undefined"
      (click)="$event.stopPropagation()"
    >
      @if (title || showCloseButton) {
        <header class="app-modal-header">
          <div class="app-modal-titles">
            <ng-content select="[header-badge]"></ng-content>
            @if (title) {
              <h2 id="modal-dialog-title" class="app-modal-title">{{ title }}</h2>
            }
            @if (subtitle) {
              <p class="app-modal-subtitle">{{ subtitle }}</p>
            }
          </div>
          @if (showCloseButton) {
            <button
              type="button"
              class="app-modal-close"
              aria-label="Close dialog"
              (click)="close()"
            >
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          }
        </header>
      }

      <div class="app-modal-body">
        <ng-content></ng-content>
      </div>

      <div class="app-modal-footer">
        <ng-content select="[footer]"></ng-content>
      </div>
    </div>
  </div>
}
