<div class="notification-bell">
  <button
    type="button"
    class="icon-link"
    [class.has-unread]="service.unreadCount() > 0"
    [class.active]="isOpen()"
    [class.ringing]="isRinging()"
    [attr.aria-label]="service.unreadCount() > 0 ? 'Notifications, ' + service.unreadCount() + ' unread' : 'Notifications'"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    @if (service.unreadCount() > 0) {
      <span class="icon-badge" aria-hidden="true">{{ badgeText() }}</span>
    }
  </button>

  @if (isOpen()) {
    <div class="notification-dropdown" role="dialog" aria-label="Notifications">
      <div class="notification-dropdown-header">
        <span>Notifications</span>
        @if (service.unreadCount() > 0) {
          <button type="button" class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
        }
      </div>

      <div class="notification-list">
        @for (notification of service.notifications(); track notification.notificationId) {
          <button
            type="button"
            class="notification-item"
            [class.unread]="!notification.isRead"
            (click)="open(notification)"
          >
            <span [class]="'notification-icon ' + kindOf(notification)" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                @switch (kindOf(notification)) {
                  @case ('placed') {
                    <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>
                  }
                  @case ('confirmed') {
                    <path d="M9 3h6v3H9z"/><path d="M15 4.5h2a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>
                  }
                  @case ('shipped') {
                    <path d="M1 5h14v11H1z"/><path d="M15 9h4l4 4v3h-8"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/>
                  }
                  @case ('delivered') {
                    <circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
                  }
                  @case ('cancelled') {
                    <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/>
                  }
                  @case ('stock') {
                    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
                  }
                  @case ('welcome') {
                    <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>
                  }
                  @case ('coupon') {
                    <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><path d="M7.5 7.5h.01"/>
                  }
                  @case ('restock') {
                    <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="m9 15.5 2 2 4-4"/>
                  }
                  @case ('price') {
                    <path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/>
                  }
                  @case ('return') {
                    <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>
                  }
                  @default {
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                  }
                }
              </svg>
            </span>

            <span class="notification-body">
              <span class="notification-title">{{ notification.title }}</span>
              <span class="notification-message">{{ notification.message }}</span>
              @if (notification.type === 'Coupon' && notification.couponCode) {
                <span class="notification-coupon-code">{{ notification.couponCode }} · Tap to copy</span>
              }
              <span class="notification-time" [title]="notification.createdAt | date: 'medium'">
                {{ timeAgo(notification.createdAt) }}
              </span>
            </span>

            @if (!notification.isRead) {
              <span class="unread-dot" aria-hidden="true"></span>
            }
          </button>
        } @empty {
          <div class="notification-empty">
            <span class="notification-empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
            </span>
            <p class="notification-empty-title">You're all caught up</p>
            <p class="notification-empty-text">Updates about your orders and offers will appear here.</p>
          </div>
        }
      </div>
    </div>
  }
</div>
