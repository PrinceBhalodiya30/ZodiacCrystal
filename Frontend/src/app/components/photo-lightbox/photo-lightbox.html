@if (current(); as url) {
  <div class="photo-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" (click)="closed.emit()">
    <button type="button" class="photo-lightbox-close" aria-label="Close" (click)="closed.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>

    <figure class="photo-lightbox-figure" (click)="$event.stopPropagation()">
      <img [src]="url" [alt]="caption() || 'Customer photo'" />
      @if (caption() || hasMany()) {
        <figcaption>
          {{ caption() }}
          @if (hasMany()) {
            <span class="photo-lightbox-count">{{ index() + 1 }} / {{ photos().length }}</span>
          }
        </figcaption>
      }
    </figure>

    @if (hasMany()) {
      <button type="button" class="photo-lightbox-nav prev" aria-label="Previous photo" (click)="step(-1); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <button type="button" class="photo-lightbox-nav next" aria-label="Next photo" (click)="step(1); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    }
  </div>
}
