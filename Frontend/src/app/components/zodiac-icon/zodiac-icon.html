@if (variant === 'medallion') {
  <svg class="zodiac-icon zodiac-icon--medallion" viewBox="0 0 120 120" [attr.aria-label]="sign" role="img">
    <circle cx="60" cy="60" r="56.5" class="medallion-bg" />
    <circle cx="60" cy="60" r="50.5" class="medallion-orbit" />
    <circle cx="60" cy="60" r="45" class="medallion-inner" />
    <polygon points="60,9 61.4,12.5 60,14 58.6,12.5" class="medallion-star" />
    <polygon points="111,60 107.5,61.4 106,60 107.5,58.6" class="medallion-star" />
    <polygon points="60,111 61.4,107.5 60,106 58.6,107.5" class="medallion-star" />
    <polygon points="9,60 12.5,61.4 14,60 12.5,58.6" class="medallion-star" />
    <g transform="translate(30, 30) scale(2.5)">
      <path [attr.d]="path" fill="none" class="medallion-glyph" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </svg>
} @else {
  <svg class="zodiac-icon zodiac-icon--glyph" viewBox="0 0 24 24" [attr.aria-label]="sign" role="img">
    <path [attr.d]="path"
          fill="none"
          stroke="currentColor"
          [attr.stroke-width]="strokeWidth || 1.85"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </svg>
}
