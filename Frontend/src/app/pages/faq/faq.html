<section class="container faq-page">
  <a class="page-back-link" routerLink="/">← Back to home</a>
  <h1>Frequently Asked Questions</h1>

  <div class="faq-list">
    @for (item of faqs; track item.question; let i = $index) {
      <div class="faq-item" [class.open]="openIndex() === i">
        <h2 class="faq-question-heading">
          <button
            type="button"
            class="faq-question"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-answer-' + i"
            [id]="'faq-question-' + i"
            (click)="toggle(i)"
          >
            <span>{{ item.question }}</span>
            <span class="faq-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
          </button>
        </h2>

        <div class="faq-answer-collapse" [class.open]="openIndex() === i">
          <p
            class="faq-answer"
            [id]="'faq-answer-' + i"
            [attr.role]="'region'"
            [attr.aria-labelledby]="'faq-question-' + i"
            [attr.aria-hidden]="openIndex() !== i"
          >{{ item.answer }}</p>
        </div>
      </div>
    }
  </div>
</section>
