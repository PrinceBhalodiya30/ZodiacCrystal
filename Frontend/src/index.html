  <!-- Splash loader: inline so it paints before any JS or CSS bundle arrives.
       App removes it after the first page has rendered. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #f7f4ee;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    #app-splash svg {
      width: 72px;
      height: 72px;
      animation: splash-float 1.6s ease-in-out infinite;
    }
    #app-splash .splash-bar {
      width: 88px;
      height: 3px;
      border-radius: 3px;
      background-color: #e6e2da;
      overflow: hidden;
    }
    #app-splash .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background-color: #2f4a3a;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-float {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-6px); opacity: 0.85; }
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash svg,
      #app-splash .splash-bar::after {
        animation: none;
      }
    }
  </style>
</head>
