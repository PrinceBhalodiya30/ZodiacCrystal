  <!-- Splash loader: inline so it paints before any JS or CSS bundle arrives.
       App removes it after the first page has rendered. -->
  <style>
    /* Industry-Standard Top-of-Page Progress Bar (YouTube / GitHub / Shopify style) */
    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 99999;
      pointer-events: none;
      background: transparent;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #app-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .top-progress-track {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .top-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2f4a3a 0%, #c5a059 50%, #dfbe7a 100%);
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.7), 0 0 4px rgba(223, 190, 122, 0.9);
      animation: top-bar-trickle 2s cubic-bezier(0.12, 0.65, 0.35, 1) forwards;
      transition: width 0.2s ease-out;
    }

    /* Radiant light beam head at the edge of the bar */
    .top-progress-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: -1px;
      width: 80px;
      height: 5px;
      background: radial-gradient(ellipse at center, rgba(244, 229, 190, 1) 0%, rgba(223, 190, 122, 0.4) 60%, transparent 100%);
      box-shadow: 0 0 12px #dfbe7a, 0 0 6px #ffffff;
      opacity: 0.9;
    }

    /* When Angular is ready, shoot to 100% and fade out */
    #app-splash.is-hidden .top-progress-fill {
      width: 100% !important;
      animation: none;
    }

    @keyframes top-bar-trickle {
      0% {
        width: 0%;
      }
      20% {
        width: 32%;
      }
      50% {
        width: 62%;
      }
      80% {
        width: 82%;
      }
      100% {
        width: 90%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .top-progress-fill {
        animation: none;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="progressbar" aria-label="Page loading">
    <div class="top-progress-track">
      <div class="top-progress-fill"></div>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
