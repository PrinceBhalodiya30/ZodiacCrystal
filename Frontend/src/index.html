<html lang="en">
<head>
  <meta charset="utf-8">

  <meta property="og:description" content="Healing crystals matched to your zodiac sign.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/og-image.png">
  <!-- Site-wide structured data. Page-specific data (Product, Article) is
       added by SeoService. Replace localhost with the live domain. -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"Crystal Studio","url":"http://localhost:4200/","logo":"http://localhost:4200/logo.png"}
  </script>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=9">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=9">
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=9">
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=9">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png?v=9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
  <!-- Zodiac symbols (only these 13 characters are downloaded): exact standard
       shapes in any colour, instead of device emoji/fonts. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap&text=%E2%99%88%E2%99%89%E2%99%8A%E2%99%8B%E2%99%8C%E2%99%8D%E2%99%8E%E2%99%8F%E2%99%90%E2%99%91%E2%99%92%E2%99%93%E2%9C%A6">
  <!-- Splash loader: inline so it paints before any JS or CSS bundle arrives.
       App removes it after the first page has rendered. -->
  <style>
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #f7f4ee;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
    }
    #app-splash svg {
      width: 72px;
      height: 72px;
      animation: splash-float 1.6s ease-in-out infinite;
    }
    #app-splash .splash-bar {
      width: 88px;
      height: 3px;
      border-radius: 3px;
      background-color: #e6e2da;
      overflow: hidden;
    }
    #app-splash .splash-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background-color: #2f4a3a;
      animation: splash-slide 1.1s ease-in-out infinite;
    }
    @keyframes splash-float {
      0%, 100% { transform: translateY(0); opacity: 1; }
      50% { transform: translateY(-6px); opacity: 0.85; }
    }
    @keyframes splash-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-splash svg,
      #app-splash .splash-bar::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Loading">
    <img src="logo-icon.png" width="72" height="72" alt="Crystal Studio" style="animation: splash-float 1.6s ease-in-out infinite; object-fit: contain;" />
    <div class="splash-bar"></div>
  </div>
  <app-root></app-root>
</body>
</html>
